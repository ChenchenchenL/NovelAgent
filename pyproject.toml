[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novelagent"
version = "0.1.0"
description = "Local-first personal novel writing Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
  "keyring>=25.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
novelagent = "novelagent.main:main"
novelagent-fsck = "novelagent.infrastructure.fsck:main"
novelagent-backup = "novelagent.infrastructure.backup_export:backup_cli"
novelagent-export = "novelagent.infrastructure.backup_export:export_cli"
novelagent-restore = "novelagent.infrastructure.backup_export:restore_cli"

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
